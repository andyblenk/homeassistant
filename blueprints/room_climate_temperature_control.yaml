blueprint:
  name: Room climate temperature control
  description: >-
    Version 0.11.0

    Controls the target temperature of one room and synchronizes it between a
    Home Assistant master climate entity and optional additional thermostats.

    The Manual / Automatic switch selects whether a manually chosen target
    temperature is held or the automatic rules control the room. A manual
    temperature change on any synchronized thermostat enables Manual and is
    synchronized to the others. Reduced is enforced when it begins, but a
    later deliberate temperature change can preheat while Reduced remains
    active. Optional conditions can apply Reduced, Comfort, or Normal.
    Comfort and Normal activate immediately and deactivate after five stable
    minutes. Up to four daily time windows can apply Reduced, Eco, or Heat.
    Up to three safeguard checks can end Manual and return to Automatic.

    Only target temperatures are synchronized. HVAC modes, presets, and measured
    temperatures are not changed.
  domain: automation
  author: Andreas Blenk
  homeassistant:
    min_version: 2024.10.0

  input:
    climates:
      name: Climate entities
      icon: mdi:thermostat
      input:
        master_climate:
          name: Master climate
          description: Main climate entity used by the automatic temperature control.
          selector:
            entity:
              filter:
                - domain: climate
        synchronized_climates:
          name: Additional thermostats
          description: Optional climate entities synchronized with the master.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: climate

    helpers:
      name: Room helpers
      icon: mdi:tune-variant
      input:
        heating_switch:
          name: Manual / Automatic switch
          description: On holds a manually selected temperature. Off applies the automatic rules.
          selector:
            entity:
              filter:
                - domain: input_boolean
    temperatures:
      name: Temperatures
      icon: mdi:thermometer
      input:
        normal_temperature:
          name: Normal temperature
          description: Initial Manual temperature and the target for Normal or Heat automation.
          default: 21
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
        comfort_temperature:
          name: Comfort temperature
          description: Used instead of Normal while a Comfort condition is active.
          default: 23
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
        eco_temperature:
          name: Eco temperature
          description: Automatic fallback when no higher-priority automatic rule is active.
          default: 18
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
        reduced_temperature:
          name: Reduced temperature
          description: Enforced when a Reduced condition or Reduced time window begins.
          default: 15
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
    reduced_conditions:
      name: Reduced conditions
      icon: mdi:home-minus
      collapsed: true
      input:
        reduced_condition_entities:
          name: Reduced conditions
          description: Optional Boolean, binary sensor, or timer entities. On or active applies Reduced.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: timer

    comfort_conditions:
      name: Comfort conditions
      icon: mdi:thermometer-plus
      collapsed: true
      input:
        comfort_condition_entities:
          name: Comfort conditions
          description: Optional entities. Comfort is active while any entity is on.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
    normal_conditions:
      name: Normal conditions
      icon: mdi:thermometer
      collapsed: true
      input:
        normal_condition_entities:
          name: Normal conditions
          description: Optional entities. Normal is active while any entity is on.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
    time_window_1:
      name: Time window 1
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_1_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_1_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_1_weekdays:
          name: Weekdays
          description: Days on which this time window starts.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        time_window_1_start:
          name: Start time
          description: Time at which this window starts.
          default: "23:00:00"
          selector:
            time:
        time_window_1_end:
          name: End time
          description: Time at which this window ends.
          default: "06:00:00"
          selector:
            time:

    time_window_2:
      name: Time window 2
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_2_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_2_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_2_weekdays:
          name: Weekdays
          description: Days on which this time window starts.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        time_window_2_start:
          name: Start time
          description: Time at which this window starts.
          default: "09:00:00"
          selector:
            time:
        time_window_2_end:
          name: End time
          description: Time at which this window ends.
          default: "12:00:00"
          selector:
            time:

    time_window_3:
      name: Time window 3
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_3_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_3_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_3_weekdays:
          name: Weekdays
          description: Days on which this time window starts.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        time_window_3_start:
          name: Start time
          description: Time at which this window starts.
          default: "14:00:00"
          selector:
            time:
        time_window_3_end:
          name: End time
          description: Time at which this window ends.
          default: "17:00:00"
          selector:
            time:

    time_window_4:
      name: Time window 4
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_4_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_4_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_4_weekdays:
          name: Weekdays
          description: Days on which this time window starts.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        time_window_4_start:
          name: Start time
          description: Time at which this window starts.
          default: "18:00:00"
          selector:
            time:
        time_window_4_end:
          name: End time
          description: Time at which this window ends.
          default: "22:00:00"
          selector:
            time:

    safeguard_checks:
      name: Heating safeguard checks
      icon: mdi:timer-check-outline
      collapsed: true
      input:
        safeguard_1_enabled:
          name: Enable safeguard check 1
          description: Ends Manual and returns to Automatic at this time.
          default: false
          selector:
            boolean:
        safeguard_1_time:
          name: Check time 1
          description: Daily time for the first safeguard check.
          default: "23:00:00"
          selector:
            time:
        safeguard_2_enabled:
          name: Enable safeguard check 2
          description: Ends Manual and returns to Automatic at this time.
          default: false
          selector:
            boolean:
        safeguard_2_time:
          name: Check time 2
          description: Daily time for the second safeguard check.
          default: "03:00:00"
          selector:
            time:
        safeguard_3_enabled:
          name: Enable safeguard check 3
          description: Ends Manual and returns to Automatic at this time.
          default: false
          selector:
            boolean:
        safeguard_3_time:
          name: Check time 3
          description: Daily time for the third safeguard check.
          default: "05:00:00"
          selector:
            time:
        safeguard_blocker:
          name: Blocker
          description: Optional entity. Its on state skips all safeguard checks.
          default: []
          selector:
            entity:

triggers:
  - trigger: state
    entity_id: !input master_climate
    attribute: temperature
    id: climate_temperature_changed
  - trigger: state
    entity_id: !input synchronized_climates
    attribute: temperature
    id: climate_temperature_changed
  - trigger: state
    entity_id: !input heating_switch
    id: manual_mode_changed
  - trigger: state
    entity_id: !input reduced_condition_entities
    id: reduced_condition_changed
  - trigger: state
    entity_id: !input comfort_condition_entities
    to: "on"
    id: comfort_condition_activated
  - trigger: state
    entity_id: !input comfort_condition_entities
    to: "off"
    for: "00:05:00"
    id: comfort_condition_deactivated
  - trigger: state
    entity_id: !input normal_condition_entities
    to: "on"
    id: normal_condition_activated
  - trigger: state
    entity_id: !input normal_condition_entities
    to: "off"
    for: "00:05:00"
    id: normal_condition_deactivated
  - trigger: time
    at: !input time_window_1_start
    id: time_window_1_started
  - trigger: time
    at: !input time_window_1_end
    id: time_window_1_ended
  - trigger: time
    at: !input time_window_2_start
    id: time_window_2_started
  - trigger: time
    at: !input time_window_2_end
    id: time_window_2_ended
  - trigger: time
    at: !input time_window_3_start
    id: time_window_3_started
  - trigger: time
    at: !input time_window_3_end
    id: time_window_3_ended
  - trigger: time
    at: !input time_window_4_start
    id: time_window_4_started
  - trigger: time
    at: !input time_window_4_end
    id: time_window_4_ended
  - trigger: time
    at: !input safeguard_1_time
    id: safeguard_1
  - trigger: time
    at: !input safeguard_2_time
    id: safeguard_2
  - trigger: time
    at: !input safeguard_3_time
    id: safeguard_3
  - trigger: time_pattern
    minutes: "/15"
    id: evaluate
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: event
    event_type: automation_reloaded
    id: reloaded

conditions: []

actions:
  - variables:
      master_climate_entity: !input master_climate
      synchronized_climate_entities: !input synchronized_climates
      heating_switch_entity: !input heating_switch
      reduced_condition_entities: !input reduced_condition_entities
      normal_temperature: !input normal_temperature
      comfort_temperature: !input comfort_temperature
      eco_temperature: !input eco_temperature
      reduced_temperature: !input reduced_temperature
      comfort_condition_entities: !input comfort_condition_entities
      normal_condition_entities: !input normal_condition_entities
      temperature_step: 0.5
      time_window_1_enabled: !input time_window_1_enabled
      time_window_1_mode: !input time_window_1_mode
      time_window_1_weekdays: !input time_window_1_weekdays
      time_window_1_start: !input time_window_1_start
      time_window_1_end: !input time_window_1_end
      time_window_2_enabled: !input time_window_2_enabled
      time_window_2_mode: !input time_window_2_mode
      time_window_2_weekdays: !input time_window_2_weekdays
      time_window_2_start: !input time_window_2_start
      time_window_2_end: !input time_window_2_end
      time_window_3_enabled: !input time_window_3_enabled
      time_window_3_mode: !input time_window_3_mode
      time_window_3_weekdays: !input time_window_3_weekdays
      time_window_3_start: !input time_window_3_start
      time_window_3_end: !input time_window_3_end
      time_window_4_enabled: !input time_window_4_enabled
      time_window_4_mode: !input time_window_4_mode
      time_window_4_weekdays: !input time_window_4_weekdays
      time_window_4_start: !input time_window_4_start
      time_window_4_end: !input time_window_4_end
      safeguard_1_enabled: !input safeguard_1_enabled
      safeguard_2_enabled: !input safeguard_2_enabled
      safeguard_3_enabled: !input safeguard_3_enabled
      safeguard_blocker: !input safeguard_blocker
      sync_tolerance: 0.01
      trigger_id: >-
        {{ trigger.id if trigger is defined and trigger.id is defined else 'evaluate' }}
      all_climate_entities: >-
        {{ ([master_climate_entity] + synchronized_climate_entities)
           | unique | list }}
      reduced_condition_active: >-
        {{ (expand(reduced_condition_entities)
            | selectattr('state', 'eq', 'on') | list | count > 0)
           or (expand(reduced_condition_entities)
               | selectattr('state', 'eq', 'active') | list | count > 0) }}
      time_window_1_active: >-
        {% set start = today_at(time_window_1_start) %}
        {% set end = today_at(time_window_1_end) %}
        {% set day_index = now().weekday() %}
        {% if start > end and now() < end %}
          {% set day_index = (day_index - 1) % 7 %}
        {% endif %}
        {% set weekday = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][day_index] %}
        {{ time_window_1_enabled
           and weekday in time_window_1_weekdays
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      time_window_2_active: >-
        {% set start = today_at(time_window_2_start) %}
        {% set end = today_at(time_window_2_end) %}
        {% set day_index = now().weekday() %}
        {% if start > end and now() < end %}
          {% set day_index = (day_index - 1) % 7 %}
        {% endif %}
        {% set weekday = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][day_index] %}
        {{ time_window_2_enabled
           and weekday in time_window_2_weekdays
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      time_window_3_active: >-
        {% set start = today_at(time_window_3_start) %}
        {% set end = today_at(time_window_3_end) %}
        {% set day_index = now().weekday() %}
        {% if start > end and now() < end %}
          {% set day_index = (day_index - 1) % 7 %}
        {% endif %}
        {% set weekday = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][day_index] %}
        {{ time_window_3_enabled
           and weekday in time_window_3_weekdays
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      time_window_4_active: >-
        {% set start = today_at(time_window_4_start) %}
        {% set end = today_at(time_window_4_end) %}
        {% set day_index = now().weekday() %}
        {% if start > end and now() < end %}
          {% set day_index = (day_index - 1) % 7 %}
        {% endif %}
        {% set weekday = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][day_index] %}
        {{ time_window_4_enabled
           and weekday in time_window_4_weekdays
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      active_time_window_mode: >-
        {% set active_modes = [] %}
        {% if time_window_1_active %}
          {% set active_modes = active_modes + [time_window_1_mode] %}
        {% endif %}
        {% if time_window_2_active %}
          {% set active_modes = active_modes + [time_window_2_mode] %}
        {% endif %}
        {% if time_window_3_active %}
          {% set active_modes = active_modes + [time_window_3_mode] %}
        {% endif %}
        {% if time_window_4_active %}
          {% set active_modes = active_modes + [time_window_4_mode] %}
        {% endif %}
        {% if 'reduced' in active_modes %}
          reduced
        {% elif 'eco' in active_modes %}
          eco
        {% elif 'heat' in active_modes %}
          heat
        {% else %}
          neutral
        {% endif %}
      comfort_mode_active: >-
        {% set entities = expand(comfort_condition_entities) | list %}
        {% set active = entities | selectattr('state', 'eq', 'on')
           | list | count > 0 %}
        {% set all_off = entities | count > 0
           and entities | rejectattr('state', 'eq', 'off')
           | list | count == 0 %}
        {% set ns = namespace(last_change=0) %}
        {% for entity in entities %}
          {% set changed = as_timestamp(entity.last_changed) %}
          {% if changed > ns.last_change %}
            {% set ns.last_change = changed %}
          {% endif %}
        {% endfor %}
        {% set waiting_to_deactivate = all_off
           and trigger_id != 'comfort_condition_deactivated'
           and as_timestamp(now()) - ns.last_change < 300
           and state_attr(master_climate_entity, 'temperature') is number
           and ((state_attr(master_climate_entity, 'temperature') | float
                 - comfort_temperature | float) | abs < 0.01) %}
        {{ active or waiting_to_deactivate }}
      normal_mode_active: >-
        {% set entities = expand(normal_condition_entities) | list %}
        {% set active = entities | selectattr('state', 'eq', 'on')
           | list | count > 0 %}
        {% set all_off = entities | count > 0
           and entities | rejectattr('state', 'eq', 'off')
           | list | count == 0 %}
        {% set ns = namespace(last_change=0) %}
        {% for entity in entities %}
          {% set changed = as_timestamp(entity.last_changed) %}
          {% if changed > ns.last_change %}
            {% set ns.last_change = changed %}
          {% endif %}
        {% endfor %}
        {% set waiting_to_deactivate = all_off
           and trigger_id != 'normal_condition_deactivated'
           and as_timestamp(now()) - ns.last_change < 300
           and state_attr(master_climate_entity, 'temperature') is number
           and ((state_attr(master_climate_entity, 'temperature') | float
                 - normal_temperature | float) | abs < 0.01) %}
        {{ active or waiting_to_deactivate }}
      reduced_policy_active: >-
        {{ reduced_condition_active or active_time_window_mode == 'reduced' }}
      automatic_temperature: >-
        {% if reduced_policy_active %}
          {% set raw = reduced_temperature | float %}
        {% elif active_time_window_mode == 'eco' %}
          {% set raw = eco_temperature | float %}
        {% elif active_time_window_mode == 'heat' %}
          {% set raw = comfort_temperature | float
             if comfort_mode_active else normal_temperature | float %}
        {% elif comfort_mode_active %}
          {% set raw = comfort_temperature | float %}
        {% elif normal_mode_active %}
          {% set raw = normal_temperature | float %}
        {% else %}
          {% set raw = eco_temperature | float %}
        {% endif %}
        {{ ((raw / temperature_step | float) | round(0)
            * temperature_step | float) | round(2) }}
      manual_mode_active: >-
        {{ is_state(heating_switch_entity, 'on') }}
      climate_change_triggered: >-
        {{ trigger_id == 'climate_temperature_changed' }}
      source_temperature_available: >-
        {{ climate_change_triggered
           and trigger.to_state is not none
           and trigger.to_state.attributes.temperature is number }}
      source_temperature_is_current: >-
        {{ source_temperature_available
           and state_attr(trigger.entity_id, 'temperature') is number
           and ((state_attr(trigger.entity_id, 'temperature') | float
                 - trigger.to_state.attributes.temperature | float) | abs
                < sync_tolerance | float) }}
      source_temperature: >-
        {% set raw = trigger.to_state.attributes.temperature | float(0)
           if source_temperature_available else 0 %}
        {{ ((raw / temperature_step | float) | round(0)
            * temperature_step | float) | round(2) }}
      other_climate_differs_from_source: >-
        {% set ns = namespace(differs=false) %}
        {% if source_temperature_is_current %}
          {% for climate_entity in all_climate_entities %}
            {% if climate_entity != trigger.entity_id
                  and state_attr(climate_entity, 'temperature') is number
                  and ((state_attr(climate_entity, 'temperature') | float
                        - source_temperature | float) | abs
                       >= sync_tolerance | float) %}
              {% set ns.differs = true %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.differs }}
      reduced_condition_activated: >-
        {{ trigger_id == 'reduced_condition_changed'
           and trigger.to_state is not none
           and trigger.to_state.state in ['on', 'active'] }}
      reduced_condition_ended: >-
        {{ trigger_id == 'reduced_condition_changed'
           and trigger.to_state is not none
           and trigger.to_state.state not in ['on', 'active']
           and not reduced_condition_active }}
      reduced_time_window_started: >-
        {{ (trigger_id == 'time_window_1_started'
            and time_window_1_active
            and time_window_1_mode == 'reduced')
           or (trigger_id == 'time_window_2_started'
               and time_window_2_active
               and time_window_2_mode == 'reduced')
           or (trigger_id == 'time_window_3_started'
               and time_window_3_active
               and time_window_3_mode == 'reduced')
           or (trigger_id == 'time_window_4_started'
               and time_window_4_active
               and time_window_4_mode == 'reduced') }}
      reduced_time_window_ended: >-
        {{ ((trigger_id == 'time_window_1_ended'
             and time_window_1_mode == 'reduced')
            or (trigger_id == 'time_window_2_ended'
                and time_window_2_mode == 'reduced')
            or (trigger_id == 'time_window_3_ended'
                and time_window_3_mode == 'reduced')
            or (trigger_id == 'time_window_4_ended'
                and time_window_4_mode == 'reduced'))
           and not reduced_policy_active }}
      reduced_policy_started: >-
        {{ reduced_condition_activated or reduced_time_window_started }}
      reduced_policy_ended: >-
        {{ reduced_condition_ended or reduced_time_window_ended }}
      safeguard_due: >-
        {{ ((trigger_id == 'safeguard_1' and safeguard_1_enabled)
            or (trigger_id == 'safeguard_2' and safeguard_2_enabled)
            or (trigger_id == 'safeguard_3' and safeguard_3_enabled))
           and not (safeguard_blocker | count > 0
                    and is_state(safeguard_blocker, 'on')) }}
      manual_mode_enabled_externally: >-
        {{ trigger_id == 'manual_mode_changed'
           and trigger.to_state is not none
           and trigger.to_state.state == 'on'
           and trigger.to_state.context.parent_id is none }}
      manual_temperature_change: >-
        {{ climate_change_triggered
           and source_temperature_is_current
           and not reduced_policy_started
           and not safeguard_due
           and ((((source_temperature | float) - (automatic_temperature | float)) | abs
                 >= sync_tolerance | float)
                or (manual_mode_active
                    and other_climate_differs_from_source)) }}
      target_temperature_available: >-
        {{ reduced_policy_started
           or safeguard_due
           or (reduced_policy_ended and manual_mode_active)
           or manual_temperature_change
           or manual_mode_enabled_externally
           or not manual_mode_active }}
      target_temperature: >-
        {% if reduced_policy_started %}
          {% set raw = reduced_temperature | float %}
        {% elif safeguard_due %}
          {% set raw = automatic_temperature | float %}
        {% elif reduced_policy_ended and manual_mode_active %}
          {% set raw = normal_temperature | float %}
        {% elif manual_temperature_change %}
          {% set raw = source_temperature | float %}
        {% elif manual_mode_enabled_externally %}
          {% set raw = normal_temperature | float %}
        {% else %}
          {% set raw = automatic_temperature | float %}
        {% endif %}
        {{ ((raw / temperature_step | float) | round(0)
            * temperature_step | float) | round(2) }}
      enable_manual_mode: >-
        {{ manual_temperature_change and not manual_mode_active }}
      disable_manual_mode: >-
        {{ safeguard_due and manual_mode_active }}
  - if:
      - condition: template
        value_template: "{{ disable_manual_mode }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ heating_switch_entity }}"
  - if:
      - condition: template
        value_template: "{{ enable_manual_mode }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ heating_switch_entity }}"
  - if:
      - condition: template
        value_template: "{{ target_temperature_available }}"
    then:
      - repeat:
          for_each: "{{ all_climate_entities }}"
          sequence:
            - variables:
                climate_entity: "{{ repeat.item }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ has_value(climate_entity)
                       and state_attr(climate_entity, 'temperature') is number
                       and ((state_attr(climate_entity, 'temperature') | float
                             - target_temperature | float) | abs
                            >= sync_tolerance | float) }}
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ climate_entity }}"
                  data:
                    temperature: "{{ target_temperature }}"

mode: queued
max: 20
max_exceeded: silent
