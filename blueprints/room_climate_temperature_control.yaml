blueprint:
  name: Room climate temperature control
  description: >-
    Version 0.6.1

    Controls the target temperature of one room and synchronizes it between a
    Home Assistant master climate entity and optional additional thermostats.

    Manual temperature changes are stored as the room's desired temperature.
    Automatic control applies Reduced during vacation or absence but allows
    deliberate preheating from any synchronized thermostat or Heating / Eco
    switch. Optional
    conditions can use Comfort instead of Normal. Up to four daily time windows
    can apply Reduced, Eco, or Heat. Up to three optional safeguard checks can
    end heating that was left enabled.

    Only target temperatures are synchronized. HVAC modes, presets, and measured
    temperatures are not changed.
  domain: automation
  author: Andreas Blenk
  homeassistant:
    min_version: 2024.10.0

  input:
    climates:
      name: Climate entities
      icon: mdi:thermostat
      input:
        master_climate:
          name: Master climate
          description: Main climate entity used by the automatic temperature control.
          selector:
            entity:
              filter:
                - domain: climate
        synchronized_climates:
          name: Additional thermostats
          description: Optional climate entities synchronized with the master.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: climate

    helpers:
      name: Room helpers
      icon: mdi:tune-variant
      input:
        desired_temperature_helper:
          name: Desired temperature
          description: Input Number storing the room's last desired temperature.
          selector:
            entity:
              filter:
                - domain: input_number
        heating_switch:
          name: Heating / Eco switch
          description: On selects Normal; off selects Eco when changed manually.
          selector:
            entity:
              filter:
                - domain: input_boolean
        automatic_control:
          name: Automatic temperature control
          description: Optional Input Boolean. Empty means automatic control is enabled.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean

    temperatures:
      name: Temperatures
      icon: mdi:thermometer
      input:
        normal_temperature:
          name: Normal temperature
          description: Loaded when the Heating / Eco switch is turned on manually.
          default: 21
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
        comfort_temperature:
          name: Comfort temperature
          description: Used instead of Normal while a Comfort condition is active.
          default: 23
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
        eco_temperature:
          name: Eco temperature
          description: Loaded when the Heating / Eco switch is turned off manually.
          default: 18
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
        reduced_temperature:
          name: Reduced temperature
          description: Used during vacation, absence, and Reduced time windows.
          default: 15
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
              mode: box
    reduced_conditions:
      name: Reduced conditions
      icon: mdi:home-minus
      collapsed: true
      input:
        vacation_mode:
          name: Vacation mode
          description: Optional entity. On forces Reduced while automatic control is active.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: binary_sensor
        nobody_home:
          name: Nobody at home
          description: Optional entity. On forces Reduced while automatic control is active.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: binary_sensor

    comfort_conditions:
      name: Comfort conditions
      icon: mdi:thermometer-plus
      collapsed: true
      input:
        comfort_condition_entities:
          name: Comfort conditions
          description: Optional entities. Comfort is active while any entity is on.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
    time_window_1:
      name: Time window 1
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_1_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_1_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_1_start:
          name: Start time
          description: Time at which this window starts.
          default: "23:00:00"
          selector:
            time:
        time_window_1_end:
          name: End time
          description: Time at which this window ends.
          default: "06:00:00"
          selector:
            time:

    time_window_2:
      name: Time window 2
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_2_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_2_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_2_start:
          name: Start time
          description: Time at which this window starts.
          default: "09:00:00"
          selector:
            time:
        time_window_2_end:
          name: End time
          description: Time at which this window ends.
          default: "12:00:00"
          selector:
            time:

    time_window_3:
      name: Time window 3
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_3_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_3_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_3_start:
          name: Start time
          description: Time at which this window starts.
          default: "14:00:00"
          selector:
            time:
        time_window_3_end:
          name: End time
          description: Time at which this window ends.
          default: "17:00:00"
          selector:
            time:

    time_window_4:
      name: Time window 4
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_4_enabled:
          name: Enable time window
          description: Enables this daily time window.
          default: false
          selector:
            boolean:
        time_window_4_mode:
          name: Mode
          description: Temperature mode used while this time window is active.
          default: reduced
          selector:
            select:
              options:
                - label: Reduced
                  value: reduced
                - label: Eco
                  value: eco
                - label: Heat
                  value: heat
        time_window_4_start:
          name: Start time
          description: Time at which this window starts.
          default: "18:00:00"
          selector:
            time:
        time_window_4_end:
          name: End time
          description: Time at which this window ends.
          default: "22:00:00"
          selector:
            time:

    safeguard_checks:
      name: Heating safeguard checks
      icon: mdi:timer-check-outline
      collapsed: true
      input:
        safeguard_1_enabled:
          name: Enable safeguard check 1
          description: Checks at this time whether heating was left enabled.
          default: false
          selector:
            boolean:
        safeguard_1_time:
          name: Check time 1
          description: Daily time for the first safeguard check.
          default: "23:00:00"
          selector:
            time:
        safeguard_2_enabled:
          name: Enable safeguard check 2
          description: Checks at this time whether heating was left enabled.
          default: false
          selector:
            boolean:
        safeguard_2_time:
          name: Check time 2
          description: Daily time for the second safeguard check.
          default: "03:00:00"
          selector:
            time:
        safeguard_3_enabled:
          name: Enable safeguard check 3
          description: Checks at this time whether heating was left enabled.
          default: false
          selector:
            boolean:
        safeguard_3_time:
          name: Check time 3
          description: Daily time for the third safeguard check.
          default: "05:00:00"
          selector:
            time:
        safeguard_blocker:
          name: Blocker
          description: Optional entity. Its on state skips all safeguard checks.
          default: []
          selector:
            entity:

triggers:
  - trigger: state
    entity_id: !input master_climate
    attribute: temperature
    id: climate_temperature_changed
  - trigger: state
    entity_id: !input synchronized_climates
    attribute: temperature
    id: climate_temperature_changed
  - trigger: state
    entity_id: !input desired_temperature_helper
    id: desired_temperature_changed
  - trigger: state
    entity_id: !input heating_switch
    id: heating_switch_changed
  - trigger: state
    entity_id: !input automatic_control
    id: evaluate
  - trigger: state
    entity_id: !input vacation_mode
    id: vacation_mode_changed
  - trigger: state
    entity_id: !input nobody_home
    id: nobody_home_changed
  - trigger: state
    entity_id: !input comfort_condition_entities
    id: evaluate
  - trigger: time
    at: !input time_window_1_start
    id: evaluate
  - trigger: time
    at: !input time_window_1_end
    id: evaluate
  - trigger: time
    at: !input time_window_2_start
    id: evaluate
  - trigger: time
    at: !input time_window_2_end
    id: evaluate
  - trigger: time
    at: !input time_window_3_start
    id: evaluate
  - trigger: time
    at: !input time_window_3_end
    id: evaluate
  - trigger: time
    at: !input time_window_4_start
    id: evaluate
  - trigger: time
    at: !input time_window_4_end
    id: evaluate
  - trigger: time
    at: !input safeguard_1_time
    id: safeguard_1
  - trigger: time
    at: !input safeguard_2_time
    id: safeguard_2
  - trigger: time
    at: !input safeguard_3_time
    id: safeguard_3
  - trigger: time_pattern
    minutes: "/15"
    id: evaluate
  - trigger: homeassistant
    event: start
    id: evaluate
  - trigger: event
    event_type: automation_reloaded
    id: evaluate

conditions: []

actions:
  - variables:
      master_climate_entity: !input master_climate
      synchronized_climate_entities: !input synchronized_climates
      desired_temperature_helper_entity: !input desired_temperature_helper
      heating_switch_entity: !input heating_switch
      automatic_control_entity: !input automatic_control
      vacation_mode_entity: !input vacation_mode
      nobody_home_entity: !input nobody_home
      normal_temperature: !input normal_temperature
      comfort_temperature: !input comfort_temperature
      eco_temperature: !input eco_temperature
      reduced_temperature: !input reduced_temperature
      comfort_condition_entities: !input comfort_condition_entities
      temperature_step: 0.5
      time_window_1_enabled: !input time_window_1_enabled
      time_window_1_mode: !input time_window_1_mode
      time_window_1_start: !input time_window_1_start
      time_window_1_end: !input time_window_1_end
      time_window_2_enabled: !input time_window_2_enabled
      time_window_2_mode: !input time_window_2_mode
      time_window_2_start: !input time_window_2_start
      time_window_2_end: !input time_window_2_end
      time_window_3_enabled: !input time_window_3_enabled
      time_window_3_mode: !input time_window_3_mode
      time_window_3_start: !input time_window_3_start
      time_window_3_end: !input time_window_3_end
      time_window_4_enabled: !input time_window_4_enabled
      time_window_4_mode: !input time_window_4_mode
      time_window_4_start: !input time_window_4_start
      time_window_4_end: !input time_window_4_end
      safeguard_1_enabled: !input safeguard_1_enabled
      safeguard_2_enabled: !input safeguard_2_enabled
      safeguard_3_enabled: !input safeguard_3_enabled
      safeguard_blocker: !input safeguard_blocker
      sync_tolerance: 0.01
      automatic_control_enabled: >-
        {{ automatic_control_entity | count == 0
           or is_state(automatic_control_entity, 'on') }}
      vacation_mode_active: >-
        {{ vacation_mode_entity | count > 0
           and is_state(vacation_mode_entity, 'on') }}
      nobody_home_active: >-
        {{ nobody_home_entity | count > 0
           and is_state(nobody_home_entity, 'on') }}
      time_window_1_active: >-
        {% set start = today_at(time_window_1_start) %}
        {% set end = today_at(time_window_1_end) %}
        {{ time_window_1_enabled
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      time_window_2_active: >-
        {% set start = today_at(time_window_2_start) %}
        {% set end = today_at(time_window_2_end) %}
        {{ time_window_2_enabled
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      time_window_3_active: >-
        {% set start = today_at(time_window_3_start) %}
        {% set end = today_at(time_window_3_end) %}
        {{ time_window_3_enabled
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      time_window_4_active: >-
        {% set start = today_at(time_window_4_start) %}
        {% set end = today_at(time_window_4_end) %}
        {{ time_window_4_enabled
           and start != end
           and ((start < end and start <= now() < end)
                or (start > end and (now() >= start or now() < end))) }}
      active_time_window_mode: >-
        {% set active_modes = [] %}
        {% if time_window_1_active %}
          {% set active_modes = active_modes + [time_window_1_mode] %}
        {% endif %}
        {% if time_window_2_active %}
          {% set active_modes = active_modes + [time_window_2_mode] %}
        {% endif %}
        {% if time_window_3_active %}
          {% set active_modes = active_modes + [time_window_3_mode] %}
        {% endif %}
        {% if time_window_4_active %}
          {% set active_modes = active_modes + [time_window_4_mode] %}
        {% endif %}
        {% if 'reduced' in active_modes %}
          reduced
        {% elif 'eco' in active_modes %}
          eco
        {% elif 'heat' in active_modes %}
          heat
        {% else %}
          neutral
        {% endif %}
      comfort_mode_active: >-
        {{ automatic_control_enabled
           and (expand(comfort_condition_entities)
                | selectattr('state', 'eq', 'on') | list | count > 0) }}
      away_mode_active: >-
        {{ automatic_control_enabled
           and (vacation_mode_active or nobody_home_active) }}
      away_mode_activated: >-
        {{ automatic_control_enabled
           and trigger.id in ['vacation_mode_changed', 'nobody_home_changed']
           and trigger.to_state is not none
           and trigger.to_state.state == 'on' }}
      stored_temperature_available: >-
        {{ has_value(desired_temperature_helper_entity) }}
      stored_temperature: >-
        {{ states(desired_temperature_helper_entity) | float(0) }}
      climate_change_triggered: >-
        {{ trigger.id == 'climate_temperature_changed' }}
      climate_change_is_external: >-
        {{ climate_change_triggered
           and trigger.to_state is not none
           and trigger.to_state.context.parent_id is none }}
      source_temperature_available: >-
        {{ climate_change_triggered
           and trigger.to_state is not none
           and trigger.to_state.attributes.temperature is number }}
      source_temperature_is_current: >-
        {{ source_temperature_available
           and state_attr(trigger.entity_id, 'temperature') is number
           and ((state_attr(trigger.entity_id, 'temperature') | float
                 - trigger.to_state.attributes.temperature | float) | abs < 0.01) }}
      source_temperature: >-
        {% set raw = trigger.to_state.attributes.temperature | float(0)
           if source_temperature_available else 0 %}
        {{ ((raw / temperature_step | float) | round(0)
            * temperature_step | float) | round(2) }}
      safeguard_check_due: >-
        {{ (trigger.id == 'safeguard_1'
            and safeguard_1_enabled)
           or (trigger.id == 'safeguard_2'
               and safeguard_2_enabled)
           or (trigger.id == 'safeguard_3'
               and safeguard_3_enabled) }}
      safeguard_blocked: >-
        {{ safeguard_blocker | count > 0
           and is_state(safeguard_blocker, 'on') }}
      safeguard_heating_active: >-
        {{ safeguard_check_due
           and not safeguard_blocked
           and is_state(heating_switch_entity, 'on')
           and ((stored_temperature_available
                 and stored_temperature > eco_temperature | float)
                or (state_attr(master_climate_entity, 'temperature') is number
                    and state_attr(master_climate_entity, 'temperature') | float
                        > eco_temperature | float)) }}
      heating_switch_change_is_external: >-
        {{ trigger.id == 'heating_switch_changed'
           and trigger.to_state is not none
           and trigger.to_state.context.parent_id is none }}
      manual_heating_switch_change: >-
        {{ heating_switch_change_is_external }}
      manual_away_temperature_change: >-
        {{ away_mode_active
           and climate_change_is_external
           and source_temperature_available
           and source_temperature_is_current }}
      manual_preheat_temperature_change: >-
        {{ manual_away_temperature_change
           and source_temperature | float > eco_temperature | float }}
      manual_preheat_active: >-
        {{ away_mode_active
           and not away_mode_activated
           and not safeguard_heating_active
           and (manual_preheat_temperature_change
                or (is_state(heating_switch_entity, 'on')
                    and not manual_away_temperature_change)) }}
      forced_reduced_active: >-
        {{ away_mode_active and not manual_preheat_active }}
      time_window_mode_active: >-
        {{ automatic_control_enabled
           and not manual_preheat_active
           and active_time_window_mode != 'neutral' }}
      automatic_temperature_active: >-
        {{ forced_reduced_active or time_window_mode_active }}
      requested_temperature_available: >-
        {{ (climate_change_triggered
            and climate_change_is_external
            and source_temperature_available
            and source_temperature_is_current
            and ((not away_mode_active
                  and not automatic_temperature_active)
                 or manual_away_temperature_change))
           or manual_heating_switch_change
           or safeguard_heating_active
           or stored_temperature_available }}
      requested_temperature: >-
        {% if climate_change_triggered
              and climate_change_is_external
              and source_temperature_available
              and source_temperature_is_current
              and ((not away_mode_active
                    and not automatic_temperature_active)
                   or manual_away_temperature_change) %}
          {{ source_temperature }}
        {% elif manual_heating_switch_change %}
          {{ normal_temperature | float
             if is_state(heating_switch_entity, 'on')
             else eco_temperature | float }}
        {% elif safeguard_heating_active %}
          {{ eco_temperature | float }}
        {% else %}
          {{ stored_temperature }}
        {% endif %}
      normalized_requested_temperature: >-
        {{ ((requested_temperature | float / temperature_step | float) | round(0)
            * temperature_step | float) | round(2) }}
      effective_temperature_available: >-
        {{ automatic_temperature_active or requested_temperature_available }}
      effective_temperature: >-
        {% if forced_reduced_active
              or (time_window_mode_active
                  and active_time_window_mode == 'reduced') %}
          {% set raw = reduced_temperature | float %}
        {% elif time_window_mode_active
                and active_time_window_mode == 'eco' %}
          {% set raw = eco_temperature | float %}
        {% elif time_window_mode_active
                and active_time_window_mode == 'heat' %}
          {% set raw = comfort_temperature | float
             if comfort_mode_active else normal_temperature | float %}
        {% elif comfort_mode_active
                and normalized_requested_temperature | float
                    == normal_temperature | float %}
          {% set raw = comfort_temperature | float %}
        {% else %}
          {% set raw = normalized_requested_temperature | float %}
        {% endif %}
        {{ ((raw / temperature_step | float) | round(0)
            * temperature_step | float) | round(2) }}
      desired_heating_switch_on: >-
        {{ not safeguard_heating_active
           and not away_mode_activated
           and requested_temperature_available
           and normalized_requested_temperature > eco_temperature | float
           and (not away_mode_active or manual_preheat_active) }}
      all_climate_entities: >-
        {{ ([master_climate_entity] + synchronized_climate_entities)
           | unique | list }}
  - if:
      - condition: template
        value_template: >-
          {{ requested_temperature_available
             and (not stored_temperature_available
                  or (stored_temperature
                      - normalized_requested_temperature) | abs >= 0.01) }}
    then:
      - action: input_number.set_value
        target:
          entity_id: !input desired_temperature_helper
        data:
          value: "{{ normalized_requested_temperature }}"
  - if:
      - condition: template
        value_template: >-
          {{ requested_temperature_available
             and is_state(heating_switch_entity, 'on')
                 != desired_heating_switch_on }}
    then:
      - action: >-
          input_boolean.turn_{{ 'on' if desired_heating_switch_on else 'off' }}
        target:
          entity_id: !input heating_switch
  - if:
      - condition: template
        value_template: "{{ effective_temperature_available }}"
    then:
      - repeat:
          for_each: "{{ all_climate_entities }}"
          sequence:
            - variables:
                climate_entity: "{{ repeat.item }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ has_value(climate_entity)
                       and state_attr(climate_entity, 'temperature') is number
                       and ((state_attr(climate_entity, 'temperature') | float
                             - effective_temperature | float) | abs
                            >= sync_tolerance | float) }}
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ climate_entity }}"
                  data:
                    temperature: "{{ effective_temperature }}"

mode: queued
max: 20
max_exceeded: silent
