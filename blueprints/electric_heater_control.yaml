blueprint:
  name: Electric heater control
  description: >-
    Version 1.0.0

    Controls an electric heater through a Home Assistant climate entity.

    The heater follows the target temperature of another climate entity and is
    switched off when automatic control is disabled, nobody is present, a window
    is open, or required values are unavailable. Optional battery and PV sensors
    can restrict normal heating to times with sufficient available energy.

    The blueprint expects the heater to support the HVAC modes heat and off as
    well as the configured low and medium presets. A high preset can optionally
    be enabled for large temperature differences. It is disabled by default.
    A configurable runtime limit switches off continuously enabled heating.
  domain: automation
  author: Andreas Blenk
  homeassistant:
    min_version: 2024.10.0

  input:
    basic:
      name: Basic configuration
      icon: mdi:radiator
      description: Select the heater, target temperature, and automatic control.
      input:
        heater:
          name: Electric heater
          description: >-
            Heater climate entity. Must support heat, off, and the configured presets.
          selector:
            entity:
              filter:
                - domain: climate
        target_climate:
          name: Target temperature source
          description: >-
            Climate entity providing the target temperature. Its HVAC mode is ignored.
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor:
          name: Room temperature sensor
          description: Sensor providing the current room temperature.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        automatic_control:
          name: Automatic control
          description: >-
            Optional Input Boolean. Off disables heating; empty means always enabled.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean

    safety:
      name: Safety conditions
      icon: mdi:shield-check
      description: Presence and window state must allow heating.
      input:
        presence_entity:
          name: Presence
          description: Must be on for heating to be allowed.
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: binary_sensor
        window_sensor:
          name: Window sensor
          description: The window is considered closed when this entity is off.
          selector:
            entity:
              filter:
                - domain: binary_sensor
        maximum_heating_duration:
          name: Maximum continuous heating duration
          description: Switches the heater off after this uninterrupted time in heat mode.
          default:
            hours: 5
          selector:
            duration:

    continuous_heating:
      name: Continuous heating
      icon: mdi:timer-outline
      collapsed: true
      input:
        continuous_heating_timer:
          name: Continuous heating timer
          description: >-
            Optional timer. Active uses medium and bypasses PV and battery limits.
            Safety still applies; empty disables continuous heating.
          default: []
          selector:
            entity:
              filter:
                - domain: timer

    electric_heater_only:
      name: Electric heater only mode
      icon: mdi:radiator
      collapsed: true
      input:
        electric_heater_only_helper:
          name: Electric heater only helper
          description: >-
            Optional Input Boolean. On while the heater runs within the configured
            range below target; empty disables this output.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean
        electric_heater_only_difference:
          name: Start below target
          description: Offset below target at which the helper switches on.
          default: 2
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: °C
              mode: box

    regulation:
      name: Temperature regulation
      icon: mdi:thermometer
      collapsed: true
      input:
        switch_off_tolerance:
          name: Switch off above target
          description: Offset above the target temperature at which heating stops.
          default: 0.3
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              unit_of_measurement: °C
              mode: box
        low_preset_range:
          name: Start low level below target
          description: >-
            Offset below target at which low starts. Below it, medium is used.
          default: 0.3
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              unit_of_measurement: °C
              mode: box
        high_enabled:
          name: Allow high level
          description: >-
            Allows high for large temperature differences. Disabled by default.
          default: false
          selector:
            boolean:
        high_temperature_difference:
          name: Start high level below target
          description: Offset below target at which high starts when enabled.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              unit_of_measurement: °C
              mode: box

    presets:
      name: Heater power presets
      icon: mdi:radiator
      collapsed: true
      description: >-
        Map low, medium, and high to the preset names supported by the heater.
      input:
        low_preset:
          name: Low level preset
          description: Heater preset used near the target temperature.
          default: low
          selector:
            select:
              options:
                - low
                - mid
                - high
              custom_value: true
              mode: dropdown
        medium_preset:
          name: Medium level preset
          description: Heater preset used below the low-level range and by the timer.
          default: mid
          selector:
            select:
              options:
                - low
                - mid
                - high
              custom_value: true
              mode: dropdown
        high_preset:
          name: High level preset
          description: Only used when the high level is enabled.
          default: high
          selector:
            select:
              options:
                - low
                - mid
                - high
              custom_value: true
              mode: dropdown

    energy:
      name: PV and battery control
      icon: mdi:solar-power
      collapsed: true
      description: >-
        Restrict normal heating based on optional PV power and battery charge.
      input:
        battery_sensor:
          name: Battery state of charge
          description: Battery sensor used for heating approval. Empty disables it.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
        battery_threshold:
          name: Minimum battery state of charge
          description: Battery charge must exceed this value to allow heating.
          default: 65
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        pv_power_sensor:
          name: PV power
          description: PV power sensor used for heating approval. Empty disables it.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        pv_power_threshold:
          name: Minimum PV power
          description: PV power must exceed this value, using the sensor's unit.
          default: 2
          selector:
            number:
              min: 0
              max: 50000
              step: 0.1
              mode: box

    surplus_heating:
      name: PV surplus heating
      icon: mdi:solar-power-variant
      collapsed: true
      input:
        surplus_heating_enabled:
          name: Enable PV surplus heating
          description: Uses a higher target temperature when PV power is sufficient.
          default: false
          selector:
            boolean:
        surplus_start_time:
          name: Earliest start time
          description: PV surplus heating is disabled before this time each day.
          default: "13:00:00"
          selector:
            time:
        surplus_pv_threshold:
          name: Minimum PV power
          description: PV power must exceed this value, using the sensor's unit.
          default: 5
          selector:
            number:
              min: 0
              max: 50000
              step: 0.1
              mode: box
        surplus_target_temperature:
          name: Target temperature helper
          description: Input Number providing the target for surplus heating.
          default: []
          selector:
            entity:
              filter:
                - domain: input_number
        surplus_temperature_offset:
          name: Additional target temperature
          description: Added to the target temperature helper while surplus heating.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: °C
              mode: box

triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: state
    entity_id: !input temperature_sensor
  - trigger: state
    entity_id: !input target_climate
    attribute: temperature
  - trigger: state
    entity_id: !input automatic_control
  - trigger: state
    entity_id: !input presence_entity
  - trigger: state
    entity_id: !input window_sensor
  - trigger: state
    entity_id: !input continuous_heating_timer
  - trigger: state
    entity_id: !input battery_sensor
  - trigger: state
    entity_id: !input surplus_target_temperature
  - trigger: state
    entity_id: !input heater
    to: heat
    for: !input maximum_heating_duration
    id: maximum_heating_duration_reached
  - trigger: time
    at: !input surplus_start_time
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded

conditions: []

actions:
  - variables:
      safety_electric_heater_only_helper_entity: !input electric_heater_only_helper
  - if:
      - condition: trigger
        id: maximum_heating_duration_reached
    then:
      - if:
          - condition: template
            value_template: >-
              {{ safety_electric_heater_only_helper_entity | count > 0 }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: !input electric_heater_only_helper
      - action: climate.set_hvac_mode
        target:
          entity_id: !input heater
        data:
          hvac_mode: "off"
      - stop: Maximum continuous heating duration reached
  - variables:
      heater_entity: !input heater
      target_climate_entity: !input target_climate
      temperature_sensor_entity: !input temperature_sensor
      automatic_control_entity: !input automatic_control
      presence_entity: !input presence_entity
      window_sensor_entity: !input window_sensor
      continuous_heating_timer_entity: !input continuous_heating_timer
      electric_heater_only_helper_entity: !input electric_heater_only_helper
      electric_heater_only_difference: !input electric_heater_only_difference
      battery_sensor_entity: !input battery_sensor
      battery_threshold: !input battery_threshold
      pv_power_sensor_entity: !input pv_power_sensor
      pv_power_threshold: !input pv_power_threshold
      surplus_heating_enabled: !input surplus_heating_enabled
      surplus_start_time: !input surplus_start_time
      surplus_pv_threshold: !input surplus_pv_threshold
      surplus_target_temperature_entity: !input surplus_target_temperature
      surplus_temperature_offset: !input surplus_temperature_offset
      switch_off_tolerance: !input switch_off_tolerance
      low_preset_range: !input low_preset_range
      low_preset: !input low_preset
      medium_preset: !input medium_preset
      high_enabled: !input high_enabled
      high_preset: !input high_preset
      high_temperature_difference: !input high_temperature_difference
      current_temperature: "{{ states(temperature_sensor_entity) | float(0) }}"
      safety_conditions_met: >-
        {{ (automatic_control_entity | count == 0
            or is_state(automatic_control_entity, 'on'))
           and is_state(presence_entity, 'on')
           and is_state(window_sensor_entity, 'off') }}
      continuous_heating: >-
        {{ is_state(continuous_heating_timer_entity, 'active') }}
      battery_configured: "{{ battery_sensor_entity | count > 0 }}"
      pv_power_configured: "{{ pv_power_sensor_entity | count > 0 }}"
      battery_energy_available: >-
        {{ battery_configured
           and has_value(battery_sensor_entity)
           and states(battery_sensor_entity) | float(0) > battery_threshold | float }}
      pv_energy_available: >-
        {{ pv_power_configured
           and has_value(pv_power_sensor_entity)
           and states(pv_power_sensor_entity) | float(0) > pv_power_threshold | float }}
      surplus_target_configured: >-
        {{ surplus_target_temperature_entity | count > 0 }}
      surplus_heating_active: >-
        {{ surplus_heating_enabled
           and now() >= today_at(surplus_start_time)
           and pv_power_configured
           and surplus_target_configured
           and has_value(pv_power_sensor_entity)
           and has_value(surplus_target_temperature_entity)
           and states(pv_power_sensor_entity) | float(0)
               > surplus_pv_threshold | float }}
      target_temperature: >-
        {% if surplus_heating_active %}
          {{ states(surplus_target_temperature_entity) | float(0)
             + surplus_temperature_offset | float }}
        {% else %}
          {{ state_attr(target_climate_entity, 'temperature') | float(0) }}
        {% endif %}
      required_values_available: >-
        {{ has_value(heater_entity)
           and has_value(temperature_sensor_entity)
           and (surplus_heating_active
                or state_attr(target_climate_entity, 'temperature') is number) }}
      normal_energy_available: >-
        {{ (not battery_configured and not pv_power_configured)
           or battery_energy_available
           or pv_energy_available }}
      heater_is_heating: "{{ is_state(heater_entity, 'heat') }}"
      heating_allowed: >-
        {{ required_values_available
           and safety_conditions_met
           and (continuous_heating
                or surplus_heating_active
                or normal_energy_available) }}
      heating_level: >-
        {% if not heating_allowed %}
          off
        {% elif continuous_heating %}
          {{ medium_preset }}
        {% elif heater_is_heating
                and current_temperature
                    >= target_temperature + switch_off_tolerance %}
          off
        {% elif not heater_is_heating
                and current_temperature >= target_temperature %}
          off
        {% elif high_enabled
                and current_temperature < target_temperature - high_temperature_difference %}
          {{ high_preset }}
        {% elif current_temperature >= target_temperature - low_preset_range %}
          {{ low_preset }}
        {% else %}
          {{ medium_preset }}
        {% endif %}
      electric_heater_only_active: >-
        {{ heating_level != 'off'
           and current_temperature
               >= target_temperature - electric_heater_only_difference }}
      heater_should_switch_off: >-
        {{ heating_level == 'off'
           and has_value(heater_entity)
           and not is_state(heater_entity, 'off') }}
      heater_should_switch_to_heat: >-
        {{ heating_level != 'off'
           and has_value(heater_entity)
           and not is_state(heater_entity, 'heat') }}
      heater_should_change_preset: >-
        {{ heating_level != 'off'
           and has_value(heater_entity)
           and state_attr(heater_entity, 'preset_mode') != heating_level }}
  - if:
      - condition: template
        value_template: "{{ electric_heater_only_helper_entity | count > 0 }}"
    then:
      - action: >-
          input_boolean.turn_{{ 'on' if electric_heater_only_active else 'off' }}
        target:
          entity_id: !input electric_heater_only_helper
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ heating_level == 'off' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ heater_should_switch_off }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: !input heater
                data:
                  hvac_mode: "off"
    default:
      - if:
          - condition: template
            value_template: "{{ heater_should_switch_to_heat }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input heater
            data:
              hvac_mode: heat
      - if:
          - condition: template
            value_template: >-
              {{ heater_should_switch_to_heat or heater_should_change_preset }}
        then:
          - action: climate.set_preset_mode
            target:
              entity_id: !input heater
            data:
              preset_mode: "{{ heating_level }}"

mode: restart
max_exceeded: silent
