blueprint:
  name: Viessmann heating control
  description: >-
    Version 0.3.1

    Controls a Viessmann heating system through its ViCare operating modes.
    Away conditions use standby to disable heating and domestic hot water.
    An optional Pre-heat timer overrides away conditions: it uses dhw during
    summer and dhwAndHeating otherwise. Summer conditions use dhw for domestic
    hot water only. Otherwise, dhwAndHeating restores normal scheduled operation.

    Pre-heat has priority over away and summer conditions. Away conditions have
    priority over summer conditions. A ViCare action is sent only when the
    requested mode differs from active_vicare_mode.
  domain: automation
  author: Andreas Blenk
  homeassistant:
    min_version: 2024.10.0

  input:
    heating:
      name: Viessmann heating
      icon: mdi:heating-coil
      input:
        heating_climate:
          name: Heating climate
          description: ViCare Climate entity whose operating mode is controlled.
          selector:
            entity:
              filter:
                - domain: climate

    reduced_conditions:
      name: Away / off conditions
      icon: mdi:home-off
      collapsed: true
      input:
        reduced_condition_entities:
          name: Away conditions
          description: Optional entities, for example nobody at home or vacation. Any on or active state selects standby.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: timer

    summer_conditions:
      name: Summer conditions
      icon: mdi:weather-sunny
      collapsed: true
      input:
        summer_condition_entities:
          name: Summer conditions
          description: Optional entities. Any on or active state enables DHW only.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: timer

    preheat:
      name: Pre-heat
      icon: mdi:fire
      collapsed: true
      input:
        preheat_timer:
          name: Pre-heat timer
          description: Optional timer. Active enables hot water and, outside summer, heating.
          default: []
          selector:
            entity:
              filter:
                - domain: timer

triggers:
  - trigger: state
    entity_id: !input reduced_condition_entities
  - trigger: state
    entity_id: !input summer_condition_entities
  - trigger: state
    entity_id: !input preheat_timer
  - trigger: time_pattern
    minutes: "/15"
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded

conditions: []

actions:
  - variables:
      heating_climate_entity: !input heating_climate
      reduced_condition_entities: !input reduced_condition_entities
      summer_condition_entities: !input summer_condition_entities
      preheat_timer_entity: !input preheat_timer
      away_active: >-
        {{ (expand(reduced_condition_entities)
            | selectattr('state', 'eq', 'on') | list | count > 0)
           or (expand(reduced_condition_entities)
               | selectattr('state', 'eq', 'active') | list | count > 0) }}
      summer_active: >-
        {{ (expand(summer_condition_entities)
            | selectattr('state', 'eq', 'on') | list | count > 0)
           or (expand(summer_condition_entities)
               | selectattr('state', 'eq', 'active') | list | count > 0) }}
      preheat_active: >-
        {{ preheat_timer_entity | count > 0
           and is_state(preheat_timer_entity, 'active') }}
      requested_vicare_mode: >-
        {% if preheat_active and summer_active %}
          dhw
        {% elif preheat_active %}
          dhwAndHeating
        {% elif away_active %}
          standby
        {% elif summer_active %}
          dhw
        {% else %}
          dhwAndHeating
        {% endif %}
      active_vicare_mode: >-
        {{ state_attr(heating_climate_entity, 'active_vicare_mode') | default('', true) }}
      supported_vicare_modes: >-
        {{ state_attr(heating_climate_entity, 'vicare_modes') | default([], true) }}
      mode_change_required: >-
        {{ has_value(heating_climate_entity)
           and requested_vicare_mode in supported_vicare_modes
           and active_vicare_mode != requested_vicare_mode }}
  - if:
      - condition: template
        value_template: "{{ mode_change_required }}"
    then:
      - action: vicare.set_vicare_mode
        target:
          entity_id: !input heating_climate
        data:
          vicare_mode: "{{ requested_vicare_mode }}"

mode: single
max_exceeded: silent
