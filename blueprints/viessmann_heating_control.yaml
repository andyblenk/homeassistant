blueprint:
  name: Viessmann heating control
  description: >-
    Version 0.4.0

    Controls a Viessmann heating system through its ViCare operating modes.
    Summer conditions use dhw for domestic hot water only. Combined summer and
    away conditions use standby to disable heating and domestic hot water. Away
    conditions outside summer use forced reduced heating, which deactivates
    domestic hot water while preserving the reduced temperature configured in
    the heating system.
    An optional Pre-heat timer overrides away conditions: it uses dhw during
    summer and dhwAndHeating otherwise. Otherwise, dhwAndHeating restores
    normal scheduled operation.

    Pre-heat has priority over summer and away conditions. Combined summer and
    away conditions have priority over either condition by itself. An action is
    sent only when the requested mode differs from the active mode.
  domain: automation
  author: Andreas Blenk
  homeassistant:
    min_version: 2024.10.0

  input:
    heating:
      name: Viessmann heating
      icon: mdi:heating-coil
      input:
        heating_climate:
          name: Heating climate
          description: ViCare Climate entity whose operating mode is controlled.
          selector:
            entity:
              filter:
                - domain: climate

    reduced_conditions:
      name: Away / off conditions
      icon: mdi:home-off
      collapsed: true
      input:
        reduced_condition_entities:
          name: Away conditions
          description: Optional entities, for example nobody at home or vacation. Any on or active state selects permanently reduced heating and disables domestic hot water. Together with Summer, it selects standby.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: timer

    summer_conditions:
      name: Summer conditions
      icon: mdi:weather-sunny
      collapsed: true
      input:
        summer_condition_entities:
          name: Summer conditions
          description: Optional entities. Any on or active state enables DHW only.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: timer

    preheat:
      name: Pre-heat
      icon: mdi:fire
      collapsed: true
      input:
        preheat_timer:
          name: Pre-heat timer
          description: Optional timer. Active enables hot water and, outside summer, heating.
          default: []
          selector:
            entity:
              filter:
                - domain: timer

triggers:
  - trigger: state
    entity_id: !input reduced_condition_entities
  - trigger: state
    entity_id: !input summer_condition_entities
  - trigger: state
    entity_id: !input preheat_timer
  - trigger: time_pattern
    minutes: "/15"
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded

conditions: []

actions:
  - variables:
      heating_climate_entity: !input heating_climate
      reduced_condition_entities: !input reduced_condition_entities
      summer_condition_entities: !input summer_condition_entities
      preheat_timer_entity: !input preheat_timer
      away_active: >-
        {{ (expand(reduced_condition_entities)
            | selectattr('state', 'eq', 'on') | list | count > 0)
           or (expand(reduced_condition_entities)
               | selectattr('state', 'eq', 'active') | list | count > 0) }}
      summer_active: >-
        {{ (expand(summer_condition_entities)
            | selectattr('state', 'eq', 'on') | list | count > 0)
           or (expand(summer_condition_entities)
               | selectattr('state', 'eq', 'active') | list | count > 0) }}
      preheat_active: >-
        {{ preheat_timer_entity | count > 0
           and is_state(preheat_timer_entity, 'active') }}
      requested_control: >-
        {% if preheat_active and summer_active %}
          dhw
        {% elif preheat_active %}
          dhwAndHeating
        {% elif summer_active and away_active %}
          standby
        {% elif summer_active %}
          dhw
        {% elif away_active %}
          forced_reduced
        {% else %}
          dhwAndHeating
        {% endif %}
      requested_vicare_mode: >-
        {{ requested_control if requested_control != 'forced_reduced' else '' }}
      active_vicare_mode: >-
        {{ state_attr(heating_climate_entity, 'active_vicare_mode') | default('', true) }}
      supported_vicare_modes: >-
        {{ state_attr(heating_climate_entity, 'vicare_modes') | default([], true) }}
      active_hvac_mode: >-
        {{ states(heating_climate_entity) }}
      supported_hvac_modes: >-
        {{ state_attr(heating_climate_entity, 'hvac_modes') | default([], true) }}
      mode_change_required: >-
        {{ has_value(heating_climate_entity)
           and ((requested_control == 'forced_reduced'
                 and 'off' in supported_hvac_modes
                 and active_hvac_mode != 'off')
                or (requested_control != 'forced_reduced'
                    and requested_vicare_mode in supported_vicare_modes
                    and active_vicare_mode != requested_vicare_mode)) }}
  - if:
      - condition: template
        value_template: "{{ mode_change_required }}"
    then:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ requested_control == 'forced_reduced' }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: !input heating_climate
                data:
                  hvac_mode: "off"
        default:
          - action: vicare.set_vicare_mode
            target:
              entity_id: !input heating_climate
            data:
              vicare_mode: "{{ requested_vicare_mode }}"

mode: single
max_exceeded: silent
