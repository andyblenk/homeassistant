blueprint:
  name: Limodor control
  description: >-
    Controls the signal line of a Limodor fan using up to three state-based
    sources or Input Buttons, three daily schedules, and an optional humidity
    sensor.

    The Limodor's internal run-on time is not included in any configured duration.
    All durations apply only to the switched signal line. Overlapping requests
    are processed in parallel; the signal is switched off only after the last
    request has ended.

    A dedicated Timer helper is required for the humidity cycle lockout.
  domain: automation
  author: Andreas / Codex
  homeassistant:
    min_version: 2024.10.0

  input:
    basic:
      name: Basic configuration
      icon: mdi:fan
      input:
        limodor_switch:
          name: Limodor signal switch
          description: >-
            Controls only the signal line. The permanent power supply is not
            controlled by this blueprint.
          selector:
            entity:
              filter:
                - domain: switch
        global_max_signal_minutes:
          name: Global safety timeout
          description: >-
            Maximum uninterrupted on-time of the Limodor signal line. When this
            limit is reached, the output is switched off regardless of active or
            overlapping requests. The Limodor's internal run-on time starts
            afterward as usual.
          default: 120
          selector:
            number:
              min: 1
              max: 720
              step: 1
              unit_of_measurement: min
              mode: box

    signal_1:
      name: Signal source 1
      icon: mdi:numeric-1-circle
      collapsed: true
      input:
        signal_1_entity:
          name: Entity
          description: >-
            Light, switch, binary sensor, Input Boolean, or Input Button.
            Leave empty to disable this signal source.
          default: []
          selector:
            entity:
              filter:
                - domain: light
                - domain: switch
                - domain: binary_sensor
                - domain: input_boolean
                - domain: input_button
        signal_1_delay_seconds:
          name: Start delay
          description: >-
            A value of 0 starts immediately when an On/Off entity switches on.
            Above 0, the entity must remain on for the entire delay; otherwise no
            signal is started. For an Input Button, the signal starts after this
            delay because each press creates a new timestamp state. Another press
            before the delay expires restarts the delay.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
              mode: box
        signal_1_min_minutes:
          name: Minimum signal duration
          description: >-
            The signal remains on for at least this duration, even if the source
            switches off earlier. After this minimum, an On/Off source keeps the
            signal on until it switches off or the maximum duration is reached.
            For an Input Button, this is the complete signal duration. Set it to 0
            to let an On/Off source control the duration directly; an Input Button
            then creates only a short pulse.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 0.1
              unit_of_measurement: min
              mode: box
        signal_1_max_minutes:
          name: Maximum signal duration
          description: >-
            Safety limit while an On/Off entity remains on. Must be greater than
            or equal to the minimum signal duration. This value is not used for
            Input Buttons.
          default: 60
          selector:
            number:
              min: 0.1
              max: 480
              step: 0.1
              unit_of_measurement: min
              mode: box

    signal_2:
      name: Signal source 2
      icon: mdi:numeric-2-circle
      collapsed: true
      input:
        signal_2_entity:
          name: Entity
          description: >-
            Light, switch, binary sensor, Input Boolean, or Input Button.
            Leave empty to disable this signal source.
          default: []
          selector:
            entity:
              filter:
                - domain: light
                - domain: switch
                - domain: binary_sensor
                - domain: input_boolean
                - domain: input_button
        signal_2_delay_seconds:
          name: Start delay
          description: >-
            A value of 0 starts immediately when an On/Off entity switches on.
            Above 0, the entity must remain on for the entire delay; otherwise no
            signal is started. For an Input Button, the signal starts after this
            delay because each press creates a new timestamp state. Another press
            before the delay expires restarts the delay.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
              mode: box
        signal_2_min_minutes:
          name: Minimum signal duration
          description: >-
            The signal remains on for at least this duration, even if the source
            switches off earlier. After this minimum, an On/Off source keeps the
            signal on until it switches off or the maximum duration is reached.
            For an Input Button, this is the complete signal duration. Set it to 0
            to let an On/Off source control the duration directly; an Input Button
            then creates only a short pulse.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 0.1
              unit_of_measurement: min
              mode: box
        signal_2_max_minutes:
          name: Maximum signal duration
          description: >-
            Must be greater than or equal to the minimum signal duration. This
            value is not used for Input Buttons.
          default: 60
          selector:
            number:
              min: 0.1
              max: 480
              step: 0.1
              unit_of_measurement: min
              mode: box

    signal_3:
      name: Signal source 3
      icon: mdi:numeric-3-circle
      collapsed: true
      input:
        signal_3_entity:
          name: Entity
          description: >-
            Light, switch, binary sensor, Input Boolean, or Input Button.
            Leave empty to disable this signal source.
          default: []
          selector:
            entity:
              filter:
                - domain: light
                - domain: switch
                - domain: binary_sensor
                - domain: input_boolean
                - domain: input_button
        signal_3_delay_seconds:
          name: Start delay
          description: >-
            A value of 0 starts immediately when an On/Off entity switches on.
            Above 0, the entity must remain on for the entire delay; otherwise no
            signal is started. For an Input Button, the signal starts after this
            delay because each press creates a new timestamp state. Another press
            before the delay expires restarts the delay.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
              mode: box
        signal_3_min_minutes:
          name: Minimum signal duration
          description: >-
            The signal remains on for at least this duration, even if the source
            switches off earlier. After this minimum, an On/Off source keeps the
            signal on until it switches off or the maximum duration is reached.
            For an Input Button, this is the complete signal duration. Set it to 0
            to let an On/Off source control the duration directly; an Input Button
            then creates only a short pulse.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 0.1
              unit_of_measurement: min
              mode: box
        signal_3_max_minutes:
          name: Maximum signal duration
          description: >-
            Must be greater than or equal to the minimum signal duration. This
            value is not used for Input Buttons.
          default: 60
          selector:
            number:
              min: 0.1
              max: 480
              step: 0.1
              unit_of_measurement: min
              mode: box

    schedule_1:
      name: Schedule 1
      icon: mdi:clock-outline
      collapsed: true
      input:
        schedule_1_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        schedule_1_time:
          name: Start time
          default: "08:00:00"
          selector:
            time:
        schedule_1_weekdays:
          name: Weekdays
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        schedule_1_duration_minutes:
          name: Signal duration
          default: 1
          selector:
            number:
              min: 0.1
              max: 480
              step: 0.1
              unit_of_measurement: min
              mode: box
        schedule_1_condition_entity:
          name: Optional Boolean condition
          description: >-
            Evaluated only when the schedule starts. Empty means no condition.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                - domain: input_boolean
                - domain: switch
                - domain: light
        schedule_1_condition_required_on:
          name: Condition must be on
          description: >-
            Enabled means the condition entity must be on. Disabled means it must
            be off.
          default: true
          selector:
            boolean:

    schedule_2:
      name: Schedule 2
      icon: mdi:clock-outline
      collapsed: true
      input:
        schedule_2_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        schedule_2_time:
          name: Start time
          default: "12:00:00"
          selector:
            time:
        schedule_2_weekdays:
          name: Weekdays
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        schedule_2_duration_minutes:
          name: Signal duration
          default: 1
          selector:
            number:
              min: 0.1
              max: 480
              step: 0.1
              unit_of_measurement: min
              mode: box
        schedule_2_condition_entity:
          name: Optional Boolean condition
          description: Evaluated only when the schedule starts. Empty means no condition.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                - domain: input_boolean
                - domain: switch
                - domain: light
        schedule_2_condition_required_on:
          name: Condition must be on
          description: >-
            Enabled means the condition entity must be on. Disabled means it must
            be off.
          default: true
          selector:
            boolean:

    schedule_3:
      name: Schedule 3
      icon: mdi:clock-outline
      collapsed: true
      input:
        schedule_3_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        schedule_3_time:
          name: Start time
          default: "18:00:00"
          selector:
            time:
        schedule_3_weekdays:
          name: Weekdays
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        schedule_3_duration_minutes:
          name: Signal duration
          default: 1
          selector:
            number:
              min: 0.1
              max: 480
              step: 0.1
              unit_of_measurement: min
              mode: box
        schedule_3_condition_entity:
          name: Optional Boolean condition
          description: Evaluated only when the schedule starts. Empty means no condition.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                - domain: input_boolean
                - domain: switch
                - domain: light
        schedule_3_condition_required_on:
          name: Condition must be on
          description: >-
            Enabled means the condition entity must be on. Disabled means it must
            be off.
          default: true
          selector:
            boolean:

    humidity:
      name: Humidity
      icon: mdi:water-percent
      collapsed: true
      input:
        humidity_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        humidity_sensor:
          name: Humidity sensor
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        humidity_threshold:
          name: Activation threshold
          description: >-
            Starts on every numeric increase whose new value is above this
            threshold.
          default: 65
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        humidity_duration_minutes:
          name: Signal duration
          description: Fixed signal duration for each triggered humidity cycle.
          default: 10
          selector:
            number:
              min: 0.1
              max: 240
              step: 0.1
              unit_of_measurement: min
              mode: box
        humidity_pause_minutes:
          name: Recheck pause
          description: >-
            Further humidity increases are ignored during the signal duration and
            this subsequent pause. Afterward, the next increase above the threshold
            can start a new cycle.
          default: 5
          selector:
            number:
              min: 0
              max: 240
              step: 0.1
              unit_of_measurement: min
              mode: box
        humidity_cooldown_timer:
          name: Humidity cycle lockout timer
          description: >-
            Manually create a dedicated Timer helper for this blueprint. It blocks
            new humidity cycles during the signal duration and recheck pause. Its
            configured default duration does not matter.
          default: []
          selector:
            entity:
              filter:
                - domain: timer

trigger_variables:
  signal_1_trigger_entity: !input signal_1_entity
  signal_2_trigger_entity: !input signal_2_entity
  signal_3_trigger_entity: !input signal_3_entity

triggers:
  - trigger: state
    entity_id: !input signal_1_entity
    to: "on"
    for:
      seconds: !input signal_1_delay_seconds
    enabled: >-
      {{ signal_1_trigger_entity is string and
         not signal_1_trigger_entity.startswith('input_button.') }}
    id: signal_1_on

  - trigger: state
    entity_id: !input signal_1_entity
    for:
      seconds: !input signal_1_delay_seconds
    enabled: >-
      {{ signal_1_trigger_entity is string and
         signal_1_trigger_entity.startswith('input_button.') }}
    id: signal_1_button

  - trigger: state
    entity_id: !input signal_2_entity
    to: "on"
    for:
      seconds: !input signal_2_delay_seconds
    enabled: >-
      {{ signal_2_trigger_entity is string and
         not signal_2_trigger_entity.startswith('input_button.') }}
    id: signal_2_on

  - trigger: state
    entity_id: !input signal_2_entity
    for:
      seconds: !input signal_2_delay_seconds
    enabled: >-
      {{ signal_2_trigger_entity is string and
         signal_2_trigger_entity.startswith('input_button.') }}
    id: signal_2_button

  - trigger: state
    entity_id: !input signal_3_entity
    to: "on"
    for:
      seconds: !input signal_3_delay_seconds
    enabled: >-
      {{ signal_3_trigger_entity is string and
         not signal_3_trigger_entity.startswith('input_button.') }}
    id: signal_3_on

  - trigger: state
    entity_id: !input signal_3_entity
    for:
      seconds: !input signal_3_delay_seconds
    enabled: >-
      {{ signal_3_trigger_entity is string and
         signal_3_trigger_entity.startswith('input_button.') }}
    id: signal_3_button

  - trigger: time
    at: !input schedule_1_time
    enabled: !input schedule_1_enabled
    id: schedule_1

  - trigger: time
    at: !input schedule_2_time
    enabled: !input schedule_2_enabled
    id: schedule_2

  - trigger: time
    at: !input schedule_3_time
    enabled: !input schedule_3_enabled
    id: schedule_3

  - trigger: state
    entity_id: !input humidity_sensor
    enabled: !input humidity_enabled
    id: humidity_rise

  - trigger: state
    entity_id: !input limodor_switch
    to: "on"
    for:
      minutes: !input global_max_signal_minutes
    id: global_safety_timeout

  - trigger: time_pattern
    minutes: "/1"
    id: global_safety_watchdog

  - trigger: homeassistant
    event: start
    id: startup

variables:
  limodor_switch: !input limodor_switch
  global_max_signal_minutes: !input global_max_signal_minutes
  global_max_signal_seconds: >-
    {{ ((global_max_signal_minutes | float(0)) * 60) | int(0) }}

  signal_1_entity: !input signal_1_entity
  signal_1_min_minutes: !input signal_1_min_minutes
  signal_1_max_minutes: !input signal_1_max_minutes
  signal_1_remaining_seconds: >-
    {{ [((((signal_1_max_minutes | float(0)) -
            (signal_1_min_minutes | float(0))) * 60) | int(0)), 0] | max }}

  signal_2_entity: !input signal_2_entity
  signal_2_min_minutes: !input signal_2_min_minutes
  signal_2_max_minutes: !input signal_2_max_minutes
  signal_2_remaining_seconds: >-
    {{ [((((signal_2_max_minutes | float(0)) -
            (signal_2_min_minutes | float(0))) * 60) | int(0)), 0] | max }}

  signal_3_entity: !input signal_3_entity
  signal_3_min_minutes: !input signal_3_min_minutes
  signal_3_max_minutes: !input signal_3_max_minutes
  signal_3_remaining_seconds: >-
    {{ [((((signal_3_max_minutes | float(0)) -
            (signal_3_min_minutes | float(0))) * 60) | int(0)), 0] | max }}

  schedule_1_condition_entity: !input schedule_1_condition_entity
  schedule_1_condition_required_on: !input schedule_1_condition_required_on
  schedule_2_condition_entity: !input schedule_2_condition_entity
  schedule_2_condition_required_on: !input schedule_2_condition_required_on
  schedule_3_condition_entity: !input schedule_3_condition_entity
  schedule_3_condition_required_on: !input schedule_3_condition_required_on

  humidity_enabled: !input humidity_enabled
  humidity_sensor: !input humidity_sensor
  humidity_threshold: !input humidity_threshold
  humidity_duration_minutes: !input humidity_duration_minutes
  humidity_pause_minutes: !input humidity_pause_minutes
  humidity_cooldown_timer: !input humidity_cooldown_timer
  humidity_block_seconds: >-
    {{ (((humidity_duration_minutes | float(0)) +
         (humidity_pause_minutes | float(0))) * 60) | int(0) }}

conditions: []

actions:
  - choose:
      - alias: Signal source 1 switched on
        conditions:
          - condition: trigger
            id: signal_1_on
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input signal_1_min_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ is_state(signal_1_entity, 'on') and
                     (signal_1_remaining_seconds | int(0)) > 0 }}
            then:
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input signal_1_entity
                    to: "off"
                timeout:
                  seconds: "{{ signal_1_remaining_seconds | int(0) }}"
                continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Input Button 1 pressed
        conditions:
          - condition: trigger
            id: signal_1_button
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input signal_1_min_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Signal source 2 switched on
        conditions:
          - condition: trigger
            id: signal_2_on
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input signal_2_min_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ is_state(signal_2_entity, 'on') and
                     (signal_2_remaining_seconds | int(0)) > 0 }}
            then:
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input signal_2_entity
                    to: "off"
                timeout:
                  seconds: "{{ signal_2_remaining_seconds | int(0) }}"
                continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Input Button 2 pressed
        conditions:
          - condition: trigger
            id: signal_2_button
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input signal_2_min_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Signal source 3 switched on
        conditions:
          - condition: trigger
            id: signal_3_on
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input signal_3_min_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ is_state(signal_3_entity, 'on') and
                     (signal_3_remaining_seconds | int(0)) > 0 }}
            then:
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input signal_3_entity
                    to: "off"
                timeout:
                  seconds: "{{ signal_3_remaining_seconds | int(0) }}"
                continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Input Button 3 pressed
        conditions:
          - condition: trigger
            id: signal_3_button
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input signal_3_min_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Schedule 1
        conditions:
          - condition: trigger
            id: schedule_1
          - condition: time
            weekday: !input schedule_1_weekdays
          - condition: template
            value_template: >-
              {{ schedule_1_condition_entity == [] or
                 schedule_1_condition_entity == '' or
                 is_state(schedule_1_condition_entity,
                          'on' if schedule_1_condition_required_on else 'off') }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input schedule_1_duration_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Schedule 2
        conditions:
          - condition: trigger
            id: schedule_2
          - condition: time
            weekday: !input schedule_2_weekdays
          - condition: template
            value_template: >-
              {{ schedule_2_condition_entity == [] or
                 schedule_2_condition_entity == '' or
                 is_state(schedule_2_condition_entity,
                          'on' if schedule_2_condition_required_on else 'off') }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input schedule_2_duration_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Schedule 3
        conditions:
          - condition: trigger
            id: schedule_3
          - condition: time
            weekday: !input schedule_3_weekdays
          - condition: template
            value_template: >-
              {{ schedule_3_condition_entity == [] or
                 schedule_3_condition_entity == '' or
                 is_state(schedule_3_condition_entity,
                          'on' if schedule_3_condition_required_on else 'off') }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input schedule_3_duration_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Global safety timeout
        conditions:
          - condition: template
            value_template: >-
              {% set output = expand(limodor_switch) | first %}
              {{ trigger.id == 'global_safety_timeout' or
                 (trigger.id == 'global_safety_watchdog' and
                  output is defined and
                  output.state == 'on' and
                  (as_timestamp(now()) - as_timestamp(output.last_changed)) >=
                    (global_max_signal_seconds | float(0))) }}
        sequence:
          - alias: Force the signal line off
            action: switch.turn_off
            target:
              entity_id: !input limodor_switch

      - alias: Humidity increase
        conditions:
          - condition: trigger
            id: humidity_rise
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none and
                 trigger.to_state is not none and
                 is_number(trigger.from_state.state) and
                 is_number(trigger.to_state.state) and
                 (trigger.to_state.state | float(0)) >
                   (trigger.from_state.state | float(0)) and
                 (trigger.to_state.state | float(0)) >
                   (humidity_threshold | float(0)) and
                 is_state(humidity_cooldown_timer, 'idle') }}
        sequence:
          - action: timer.start
            target:
              entity_id: !input humidity_cooldown_timer
            data:
              duration: "{{ humidity_block_seconds | int(0) }}"
          - action: switch.turn_on
            target:
              entity_id: !input limodor_switch
          - delay:
              minutes: !input humidity_duration_minutes
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

      - alias: Home Assistant started
        conditions:
          - condition: trigger
            id: startup
        sequence:
          - alias: Wait until the Limodor signal switch is available
            if:
              - condition: template
                value_template: >-
                  {{ states(limodor_switch) in ['unknown', 'unavailable'] }}
            then:
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input limodor_switch
                    to: "on"
                  - trigger: state
                    entity_id: !input limodor_switch
                    to: "off"

          - alias: Switch off output before deterministic reevaluation
            action: switch.turn_off
            target:
              entity_id: !input limodor_switch

          - if:
              - condition: template
                value_template: >-
                  {{ humidity_enabled and
                     humidity_cooldown_timer is string and
                     humidity_cooldown_timer != '' }}
            then:
              - action: timer.cancel
                target:
                  entity_id: !input humidity_cooldown_timer

          - parallel:
              - sequence:
                  - condition: template
                    value_template: >-
                      {{ signal_1_entity is string and
                         not signal_1_entity.startswith('input_button.') and
                         is_state(signal_1_entity, 'on') }}
                  - delay:
                      seconds: !input signal_1_delay_seconds
                  - condition: state
                    entity_id: !input signal_1_entity
                    state: "on"
                  - action: switch.turn_on
                    target:
                      entity_id: !input limodor_switch
                  - delay:
                      minutes: !input signal_1_min_minutes
                  - if:
                      - condition: template
                        value_template: >-
                          {{ is_state(signal_1_entity, 'on') and
                             (signal_1_remaining_seconds | int(0)) > 0 }}
                    then:
                      - wait_for_trigger:
                          - trigger: state
                            entity_id: !input signal_1_entity
                            to: "off"
                        timeout:
                          seconds: "{{ signal_1_remaining_seconds | int(0) }}"
                        continue_on_timeout: true

              - sequence:
                  - condition: template
                    value_template: >-
                      {{ signal_2_entity is string and
                         not signal_2_entity.startswith('input_button.') and
                         is_state(signal_2_entity, 'on') }}
                  - delay:
                      seconds: !input signal_2_delay_seconds
                  - condition: state
                    entity_id: !input signal_2_entity
                    state: "on"
                  - action: switch.turn_on
                    target:
                      entity_id: !input limodor_switch
                  - delay:
                      minutes: !input signal_2_min_minutes
                  - if:
                      - condition: template
                        value_template: >-
                          {{ is_state(signal_2_entity, 'on') and
                             (signal_2_remaining_seconds | int(0)) > 0 }}
                    then:
                      - wait_for_trigger:
                          - trigger: state
                            entity_id: !input signal_2_entity
                            to: "off"
                        timeout:
                          seconds: "{{ signal_2_remaining_seconds | int(0) }}"
                        continue_on_timeout: true

              - sequence:
                  - condition: template
                    value_template: >-
                      {{ signal_3_entity is string and
                         not signal_3_entity.startswith('input_button.') and
                         is_state(signal_3_entity, 'on') }}
                  - delay:
                      seconds: !input signal_3_delay_seconds
                  - condition: state
                    entity_id: !input signal_3_entity
                    state: "on"
                  - action: switch.turn_on
                    target:
                      entity_id: !input limodor_switch
                  - delay:
                      minutes: !input signal_3_min_minutes
                  - if:
                      - condition: template
                        value_template: >-
                          {{ is_state(signal_3_entity, 'on') and
                             (signal_3_remaining_seconds | int(0)) > 0 }}
                    then:
                      - wait_for_trigger:
                          - trigger: state
                            entity_id: !input signal_3_entity
                            to: "off"
                        timeout:
                          seconds: "{{ signal_3_remaining_seconds | int(0) }}"
                        continue_on_timeout: true

              - sequence:
                  - condition: template
                    value_template: >-
                      {{ humidity_enabled and
                         humidity_sensor is string and
                         humidity_cooldown_timer is string and
                         is_number(states(humidity_sensor)) and
                         (states(humidity_sensor) | float(0)) >
                           (humidity_threshold | float(0)) }}
                  - action: timer.start
                    target:
                      entity_id: !input humidity_cooldown_timer
                    data:
                      duration: "{{ humidity_block_seconds | int(0) }}"
                  - action: switch.turn_on
                    target:
                      entity_id: !input limodor_switch
                  - delay:
                      minutes: !input humidity_duration_minutes

          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(this.entity_id, 'current') | int(0) <= 1 }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input limodor_switch

  # Common cleanup for rejected triggers as well. The short delay ensures that
  # when parallel runs end simultaneously, the final remaining run switches off
  # the signal.
  - delay:
      milliseconds: 50
  - if:
      - condition: template
        value_template: >-
          {{ state_attr(this.entity_id, 'current') | int(0) <= 1 and
             is_state(limodor_switch, 'on') }}
    then:
      - action: switch.turn_off
        target:
          entity_id: !input limodor_switch

mode: parallel
max: 50
max_exceeded: silent
